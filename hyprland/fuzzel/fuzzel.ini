[main]
font=FantasqueSansM Nerd Font:size=12
prompt="Search: "
icon-theme=hicolor
icons-enabled=yes
width=36
lines=10
horizontal-pad=18
vertical-pad=14
inner-pad=8
line-height=22
hide-before-typing=yes
keyboard-focus=on-demand
exit-on-keyboard-focus-loss=yes

include=~/.config/fuzzel/colors.ini

[border]
width=2
radius=10
