### Steam Deck-Style Horizontal Performance Overlay for MangoHud

horizontal
legacy_layout=0

# Bind strictly to NVIDIA GeForce RTX 3050 (hides Intel iGPU)
pci_dev=0000:01:00.0
gpu_text=GPU

# Core FPS Performance
fps
fps_metrics=avg,0.01
frame_timing=0

# CPU Metrics (Usage, Temperature, Frequency)
cpu_stats
cpu_temp
cpu_mhz

# GPU Metrics - NVIDIA RTX 3050 (Usage, Temp, Core Clock, Power, VRAM)
gpu_stats
gpu_temp
gpu_core_clock
gpu_power
vram

# RAM Metric
ram

# Position & Sizing
position=top-left
font_size=16
offset_x=14
offset_y=14

# Visual Styling (Steam Deck dark pill bar with subtle separators)
background_alpha=0.65
round_corners=8
background_color=0a0d14
text_color=ffffff
horizontal_separator_color=3b4252
text_outline
text_outline_color=000000
text_outline_thickness=1.5

# Component Colors (Steam Deck palette)
gpu_color=00ff7f
cpu_color=3b92f0
vram_color=00ff7f
ram_color=c26693
fps_color=00ff7f
engine_color=ebdbb2
wine_color=ebdbb2

# Hotkey to toggle HUD on/off (Right Shift + F12)
toggle_hud=Shift_R+F12
