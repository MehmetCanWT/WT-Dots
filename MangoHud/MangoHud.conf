### Steam-style minimal FPS counter for MangoHud

# Only display the FPS number (no CPU/GPU bloat)
legacy_layout=0
fps_only

# Position (Steam default is top-left)
position=top-left

# Typography & Visuals
font_size=20
text_color=5cd85a
text_outline
text_outline_color=000000
text_outline_thickness=1.5

# Transparent background
background_alpha=0.0
round_corners=0
offset_x=10
offset_y=10

# Toggle HUD on/off shortcut (Right Shift + F12)
toggle_hud=Shift_R+F12
