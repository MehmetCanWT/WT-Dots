### Steam-style Detailed Performance Overlay for MangoHud

legacy_layout=0

# Core Performance
fps
frametime=1
frame_timing=0

# GPU Metrics (Usage, Temp, Clock, Power, VRAM)
gpu_stats
gpu_temp
gpu_core_clock
gpu_power
vram

# CPU Metrics (Usage, Temp, Clock, Power)
cpu_stats
cpu_temp
cpu_mhz
cpu_power

# RAM Metric
ram

# Position & Sizing
position=top-left
font_size=18
offset_x=12
offset_y=12

# Visual Styling (Semi-transparent background with sharp outline)
background_alpha=0.5
round_corners=8
background_color=0c1017
text_color=ffffff
text_outline
text_outline_color=000000
text_outline_thickness=1.5

# Component Colors (Steam Deck palette)
gpu_color=00ff7f
cpu_color=3b92f0
vram_color=00ff7f
ram_color=3b92f0
fps_color=00ff7f
engine_color=ebdbb2
wine_color=ebdbb2

# Hotkey to toggle HUD on/off (Right Shift + F12)
toggle_hud=Shift_R+F12
