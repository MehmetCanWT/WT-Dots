# keybinds.conf: Key, mouse, axis, and gesture shortcuts

# Reload Configuration
bind=SUPER,r,reload_config

# Launcher, Terminal, and File Manager
bind=Alt,space,spawn,rofi -show combi -modes "combi,drun,run,calc" -combi-modes "drun,calc" -theme-str 'listview { require-input: true; }'
bind=Alt,Return,spawn,kitty
bind=SUPER,e,spawn,dolphin
bind=SUPER,v,spawn,bash ~/.config/mango/scripts/clipboard.sh

# Session and Window Management
bind=SUPER,m,quit
bind=ALT,q,killclient,

# Window Focus Navigation
bind=SUPER,Tab,focusstack,next
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# Move Window
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right

# Window States
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,togglejump,
bind=ALT,backslash,togglemaximizescreen,
bind=ALT,c,centerwin,
bind=ALT,a,togglefloating,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad
bind=SUPER,d,spawn,python3 ~/.config/mango/scripts/toggle_desktop.py

# Scroller Layout Controls
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

# Dwindle Layout (Manual Split)
bind=alt+shift,Return,dwindle_toggle_split_direction

# Switch Layout
bind=SUPER,n,switch_layout

# Tag (Workspace) Navigation
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=Alt,1,view,1,0
bind=Alt,2,view,2,0
bind=Alt,3,view,3,0
bind=Alt,4,view,4,0
bind=Alt,5,view,5,0
bind=Alt,6,view,6,0
bind=Alt,7,view,7,0
bind=Alt,8,view,8,0
bind=Alt,9,view,9,0

# Move Window to Tag
bind=Ctrl,1,tag,1,0
bind=Ctrl,2,tag,2,0
bind=Ctrl,3,tag,3,0
bind=Ctrl,4,tag,4,0
bind=Ctrl,5,tag,5,0
bind=Ctrl,6,tag,6,0
bind=Ctrl,7,tag,7,0
bind=Ctrl,8,tag,8,0
bind=Ctrl,9,tag,9,0

# Monitor Focus and Movement
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# Gaps Control
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# Floating Window Move
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# Floating Window Resize
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=ALT,btn_middle,togglefullscreen,
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

# Audio Volume Controls (wpctl)
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Screenshots (grim + slurp + wl-copy to ~/Resimler/Screenshots)
bind=NONE,Print,spawn_shell,mkdir -p ~/Resimler/Screenshots && FILE=~/Resimler/Screenshots/$(date +%F_%H-%M-%S).png && grim "$FILE" && wl-copy --type image/png < "$FILE"
bind=SHIFT,Print,spawn_shell,mkdir -p ~/Resimler/Screenshots && FILE=~/Resimler/Screenshots/$(date +%F_%H-%M-%S).png && grim -g "$(slurp)" "$FILE" && wl-copy --type image/png < "$FILE"

# Wallpaper Selector and Keybindings Cheatsheet
bind=SUPER,w,spawn,python3 ~/.config/wallpaper-picker/picker.py
bind=SUPER,k,spawn,python3 ~/.config/mango/scripts/keybinds_cheatsheet.py

# Game Mode Toggle (Disables all compositor hotkeys for games)
bind=SUPER,l,setkeymode,game
