# Hypridle Configuration

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 150
    on-timeout = sh -c '[ ! -f "${XDG_RUNTIME_DIR:-/tmp}/wt-rust-keep-awake" ] && grep -qx 0 /sys/class/power_supply/ACAD/online 2>/dev/null && touch "${XDG_RUNTIME_DIR:-/tmp}/wt-rust-dimmed" && brightnessctl -s set 10%'
    on-resume = sh -c '[ -f "${XDG_RUNTIME_DIR:-/tmp}/wt-rust-dimmed" ] && rm -f "${XDG_RUNTIME_DIR:-/tmp}/wt-rust-dimmed" && brightnessctl -r'
}

listener {
    timeout = 300
    on-timeout = sh -c '[ ! -f "${XDG_RUNTIME_DIR:-/tmp}/wt-rust-keep-awake" ] && loginctl lock-session'
}

listener {
    timeout = 330
    on-timeout = sh -c '[ ! -f "${XDG_RUNTIME_DIR:-/tmp}/wt-rust-keep-awake" ] && grep -qx 0 /sys/class/power_supply/ACAD/online 2>/dev/null && hyprctl dispatch "hl.dsp.dpms({action = \"off\"})"'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 1800
    on-timeout = sh -c '[ ! -f "${XDG_RUNTIME_DIR:-/tmp}/wt-rust-keep-awake" ] && grep -qx 0 /sys/class/power_supply/ACAD/online 2>/dev/null && systemctl suspend'
}
